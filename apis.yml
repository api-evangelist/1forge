features:
  - name: Real-Time Forex Quotes
    description: Bid/ask snapshots for 700+ currency pairs with sub-second updates direct from brokers and liquidity providers.
  - name: Cryptocurrency Quotes
    description: Crypto pair coverage alongside traditional forex pairs via the same REST and WebSocket surfaces.
  - name: Currency Conversion
    description: Single-call conversion of an amount between two currencies at the current market rate.
  - name: WebSocket Streaming
    description: Real-time price-update stream over a single persistent WebSocket connection; available on paid plans.
  - name: Synthetic Pair Coverage
    description: Both organic (direct from exchanges) and synthetic (best-rate cross-pair) currency pairs.
  - name: Per-Key Quota Inspection
    description: GET /quota returns quota_used, quota_limit, quota_remaining, and hours_until_reset for the calling key.
  - name: Multi-Region Edge
    description: Requests are auto-routed to one of four global edges (Oregon, Virginia, Taiwan, Belgium) for lowest latency.
  - name: Multi-Language SDKs
    description: Official client libraries in JavaScript, PHP, Python, Java, Go, and .NET.
useCases:
  - name: Multi-Currency Checkout
    description: Convert cart totals to a customer's local currency at checkout using the /convert endpoint.
  - name: Trading App Pricing Display
    description: Drive real-time ticker UIs for retail trading and portfolio apps via REST polling or the WebSocket stream.
  - name: Treasury and Reconciliation
    description: Stamp daily reconciliation reports with mid-market FX rates for cross-border ledger entries.
  - name: FX Risk and Hedging Analytics
    description: Feed live bid/ask data into hedging and FX-exposure dashboards.
  - name: Quota and Cost Telemetry
    description: Track per-key quota burn into observability and FinOps pipelines via GET /quota.
integrations:
  - name: JavaScript / TypeScript Apps
    description: First-party forex-quotes npm library covering REST and WebSocket access.
  - name: PHP Applications
    description: Official PHP library with REST and WebSocket support.
  - name: Python Applications
    description: Official Python library for REST quote retrieval.
  - name: Java Applications
    description: Official Java library for REST quote retrieval.
  - name: Go Applications
    description: Official Go library for REST quote retrieval.
  - name: .NET Applications
    description: Official .NET (C#) library for REST quote retrieval.
solutions:
  - name: Brokerage and Trading Platforms
    description: FIX-grade speed at JSON-API cost for retail brokerages and options houses.
  - name: Fintech Apps and Wallets
    description: Live FX quotes for consumer wallets, neobanks, and remittance apps.
  - name: Ecommerce Multi-Currency Pricing
    description: Currency conversion and live rates for international checkout flows.
  - name: Analytics and BI Tools
    description: Bid/ask history capture (client-side) and conversion rates for financial dashboards.
