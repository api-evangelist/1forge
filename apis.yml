aid: 1forge
name: 1Forge
description: >-
  1Forge delivers real-time forex and cryptocurrency quotes for 700+ currency pairs through a simple JSON REST API and a
  low-latency WebSocket stream. The product targets trading apps, multi-currency checkout flows, treasury and FinOps
  tooling, and any workload that needs FIX-speed price data without the FIX-grade integration cost.
